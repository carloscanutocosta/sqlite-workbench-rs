name: Release

on:
  push:
    tags: [ "v*" ]
  # Build the packages (without publishing) when this workflow changes.
  pull_request:
    branches: [ "main" ]
    paths: [ ".github/workflows/release.yml" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: linux
            os: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Check tag matches Cargo.toml version
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
        version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
        if [ "$GITHUB_REF_NAME" != "v$version" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version v$version"
          exit 1
        fi

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

    - uses: dtolnay/rust-toolchain@stable

    - uses: swatinem/rust-cache@v2

    - name: Build
      run: cargo build --release --locked

    - name: Package
      shell: bash
      run: |
        version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
        pkg="sqlite-workbench-rs-$version-${{ matrix.name }}"
        mkdir -p "dist/$pkg"
        cp LICENSE* "dist/$pkg/"
        if [ "$RUNNER_OS" = "Windows" ]; then
          cp target/release/sqlite-workbench-rs.exe "dist/$pkg/"
          (cd dist && 7z a "$pkg.zip" "$pkg" > /dev/null)
          echo "ASSET=dist/$pkg.zip" >> "$GITHUB_ENV"
        else
          cp target/release/sqlite-workbench-rs "dist/$pkg/"
          tar -czf "dist/$pkg.tar.gz" -C dist "$pkg"
          echo "ASSET=dist/$pkg.tar.gz" >> "$GITHUB_ENV"
        fi

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.name }}
        path: ${{ env.ASSET }}
        if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true

    - uses: softprops/action-gh-release@v3
      with:
        files: dist/*
        generate_release_notes: true
